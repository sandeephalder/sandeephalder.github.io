<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0c1020}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
.wrap{width:1080px;height:1350px;padding:72px 76px 48px;display:flex;flex-direction:column;
  background:
  radial-gradient(900px 520px at 0% -5%, rgba(255,86,86,.26), transparent 60%),
  radial-gradient(800px 600px at 110% 105%, rgba(255,170,60,.18), transparent 60%),
  linear-gradient(165deg,#0e1224 0%,#131a32 50%,#0a0e1c 100%)}
.eyebrow{font-size:40px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#ffb199}
h1{font-size:100px;line-height:1.02;font-weight:800;margin-top:18px;letter-spacing:-1px}
h1 span{color:#ff6b6b}
svg{display:block;margin:34px auto 0}
.body{font-size:46px;line-height:1.3;font-weight:500;color:#eef0f8;margin-top:30px}
.body b{color:#ffcf9e;font-weight:800}
.foot{margin-top:auto;font-size:28px;color:#b9a6b8;display:flex;justify-content:space-between;border-top:2px solid rgba(255,140,110,.25);padding-top:22px}
</style>
<div class="wrap">
  <div class="eyebrow">AI agent security</div>
  <h1>Pick two.<br><span>Never all three.</span></h1>
  <svg width="860" height="600" viewBox="0 0 900 628" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#b3122a"/></radialGradient>
    </defs>
    <circle cx="450" cy="214" r="204" fill="rgba(255,159,64,.20)" stroke="#ff9f40" stroke-width="5"/>
    <circle cx="328" cy="418" r="204" fill="rgba(74,168,255,.20)" stroke="#4aa8ff" stroke-width="5"/>
    <circle cx="572" cy="418" r="204" fill="rgba(228,106,232,.20)" stroke="#e46ae8" stroke-width="5"/>
    <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="46" fill="#fff" text-anchor="middle">
      <text x="450" y="118">Untrusted</text><text x="450" y="170">content</text>
      <text x="236" y="478">Private</text><text x="236" y="530">data</text>
      <text x="664" y="478">A way</text><text x="664" y="530">out</text>
    </g>
    <circle cx="450" cy="350" r="66" fill="url(#glow)" stroke="#fff" stroke-width="4"/>
    <text x="450" y="365" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="42" fill="#fff" text-anchor="middle">Leak</text>
  </svg>
  <div class="body">An agent with all three is <b>one poisoned email or GitHub issue</b> away from leaking your data.</div>
  <div class="foot"><span>A Tangent Thought</span><span>sandeephalder.blog</span></div>
</div>
